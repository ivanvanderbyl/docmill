name: ci
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.41.0
      # `task check` runs fmt-check, go vet, and go test across the module.
      # The PDFium integration test reads a fixture from
      # .upstream-docling/tests/data/pdf/ which is git-ignored, so it is not
      # present in CI. The test guards with os.IsNotExist -> t.Skipf, so it
      # skips here; every other unit test still runs.
      - run: task check
